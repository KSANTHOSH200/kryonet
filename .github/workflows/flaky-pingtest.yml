name: PingTest-Flakiness-Demo
on: [push, pull_request]

jobs:
  pingtest:
    runs-on: ubuntu-latest
    strategy:
      matrix: { mode: [normal, nondex] }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Run PingTest (${{ matrix.mode }})
        run: |
          if [[ "${{ matrix.mode }}" == "normal" ]]; then
            for i in 1 2 3; do
              echo "🟢  normal attempt #$i"
              mvn -q -B test \
                -Dsurefire.rerunFailingTestsCount=0 \
                -Dtest=com.esotericsoftware.kryonet.PingTest#testPing
              [[ $? -eq 0 ]] && exit 0
            done
            echo "❌  failed 3× in normal mode" >&2
            exit 1
          else
            echo "🔀  NonDex mode"
            mvn -q -B edu.illinois:nondex-maven-plugin:2.1.1:nondex \
              -Dtest=com.esotericsoftware.kryonet.PingTest#testPing \
              -DnondexRuns=50        # bigger sample ⇒ deterministic fail
          fi

      - name: Assert NonDex must fail
        if: matrix.mode == 'nondex' && success()
        run: |
          echo "❌  NonDex run unexpectedly GREEN; flakiness not reproduced"
          exit 1
