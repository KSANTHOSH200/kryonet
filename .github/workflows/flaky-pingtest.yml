# CI workflow that *demonstrates* PingTest is flaky.
name: PingTest-Flakiness-Demo

on: [push, pull_request]

jobs:
  pingtest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [normal, nondex]     # run once “plain”, once with NonDex
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Run PingTest (matrix mode = ${{ matrix.mode }})
        id: run-test
        run: |
          if [[ "${{ matrix.mode }}" == "normal" ]]; then
            mvn -B -q test \
              -Dtest=com.esotericsoftware.kryonet.PingTest#testPing
          else
            # ↓ 20 seeds is enough to hit the failure in CI quickly
            mvn -B -q edu.illinois:nondex-maven-plugin:2.1.1:nondex \
              -Dtest=com.esotericsoftware.kryonet.PingTest#testPing \
              -DnondexRuns=20
          fi
      # Let the workflow PASS in “normal” mode but FAIL in “nondex” mode
      - name: Assert nondex MUST fail
        if: matrix.mode == 'nondex' && success()
        run: |
          echo "❌ NonDex completed with zero failures, but we EXPECT flakiness."
          exit 1








































